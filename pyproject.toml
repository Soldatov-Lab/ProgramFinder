[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "programfinder"
version = "0.1.0.dev0"
description = "Residuals -> PCA -> feature-space ICA (gICA) cell-program discovery, scanpy-style"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Louis Faure"}]
dependencies = [
    "numpy",
    "scipy",
    "anndata>=0.10",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
io = ["h5py"]
picard = ["python-picard"]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/programfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
